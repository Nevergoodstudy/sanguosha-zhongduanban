# GitHub Actions CI 工作流
# 三国杀项目持续集成配置

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # 代码质量检查: lint + 格式检查
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install '.[dev]'
      - name: Ruff syntax and undefined-name checks
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Ruff full lint baseline
        continue-on-error: true
        run: ruff check . --config pyproject.toml --output-format=github
      - name: Ruff full format baseline
        continue-on-error: true
        run: ruff format --check . --config pyproject.toml

  # 类型检查
  typecheck:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install '.[dev]'
      - run: mypy game/ ai/ ui/ net/ --config-file pyproject.toml

  # 单元测试 + 集成测试 + 覆盖率 (三平台)
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Run tests with coverage
        run: >
          python -m pytest tests/ -v --tb=short
          --cov=game --cov=ai --cov=ui --cov=net
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Static security analysis (Bandit)
        run: bandit -r game/ ai/ net/ -ll -ii

  # 构建检查
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: pyproject-build
      - name: Verify installed wheel outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/sanguosha-wheel"
          venv="$RUNNER_TEMP/sanguosha-wheel/bin"
          "$venv/python" -m pip install dist/*.whl
          "$venv/python" -m pip check
          cd "$RUNNER_TEMP"
          "$venv/sanguosha" --help
          "$venv/python" -c '
          from importlib.resources import files
          from game.engine import GameEngine
          from i18n import set_locale, t
          from net.server import GameServer
          engine = GameEngine()
          engine.setup_headless_game(2, seed=42)
          assert len(engine.players) == 2 and all(player.hero for player in engine.players)
          set_locale("zh_CN")
          chinese = t("ui.menu.start")
          set_locale("en_US")
          assert t("ui.menu.start") != chinese
          assert files("ui.textual_ui").joinpath("styles", "game.tcss").is_file()
          assert GameServer
          '
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 多平台 EXE 构建 (仅 main 分支)
  build-exe:
    name: Build ${{ matrix.platform.name }}
    needs: [lint, typecheck, test]
    runs-on: ${{ matrix.platform.os }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows EXE
            os: windows-latest
            build_name: sanguosha-windows-amd64
          - name: Linux Binary
            os: ubuntu-latest
            build_name: sanguosha-linux-amd64
          - name: macOS Binary
            os: macos-15
            build_name: sanguosha-macos-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[build]'
      - run: python build.py --name ${{ matrix.platform.build_name }}
      - name: Verify arm64 and launch in a terminal
        if: runner.os == 'macOS'
        run: python tools/macos_smoke.py dist/sanguosha-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.build_name }}
          path: dist/${{ matrix.platform.build_name }}*

  # 导入检查
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: python -c "import game; import ai; import ui; import net.server; print('All modules OK')"
