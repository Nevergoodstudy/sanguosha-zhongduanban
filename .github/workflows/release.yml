# 多平台构建 + 自动 Release 工作流
# 发布候选分支只构建产物，v* 标签再创建 GitHub Release。
# 构建: Windows (.exe) + macOS (binary) + Linux (binary)
# 发布: 自动创建 GitHub Release 并上传三平台产物

name: Release

on:
  push:
    branches:
      - 'release-candidate/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            platform: windows-amd64
            extension: .exe
          - name: Linux
            os: ubuntu-latest
            platform: linux-amd64
            extension: ''
          - name: macOS
            os: macos-15
            platform: macos-arm64
            extension: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install '.[build]'

      - name: Build with PyInstaller
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.platform }}
          EXTENSION: ${{ matrix.platform.extension }}
        run: |
          version=$(python -c 'from importlib.metadata import version; print(version("sanguosha"))')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          name="sanguosha-$version-$PLATFORM"
          python -m PyInstaller --version
          python build.py --name "$name"
          echo "artifact=$name$EXTENSION" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI and Chinese replay outside the repository
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          binary = Path("dist", os.environ["ARTIFACT"]).resolve()
          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              workdir = Path(directory)
              env = {
                  **os.environ,
                  "PYTHONIOENCODING": "utf-8",
                  "SANGUOSHA_DATA_HOME": directory,
                  "SANGUOSHA_LOG_FILE": str(workdir / "game.log"),
              }
              subprocess.run([binary, "--help"], cwd=workdir, env=env, check=True)
              replay = workdir / "replay.json"
              replay.write_text(json.dumps({
                  "format": "sanguosha-match",
                  "events": [{"turn": 1, "phase": "play", "message": "中文战报验证"}],
              }), encoding="utf-8")
              result = subprocess.run(
                  [binary, "--replay", replay], cwd=workdir, env=env,
                  check=True, stdout=subprocess.PIPE, encoding="utf-8",
              )
              if "中文战报验证" not in result.stdout:
                  raise SystemExit("Packaged executable did not print the Chinese replay event")
          PY
          if [ "$RUNNER_OS" = macOS ]; then
            python tools/macos_smoke.py "dist/$ARTIFACT"
          fi

      - name: Record checksum and source revision
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import platform
          import subprocess
          from importlib.metadata import version
          from pathlib import Path

          binary = Path("dist", os.environ["ARTIFACT"])
          with binary.open("rb") as artifact:
              digest = hashlib.file_digest(artifact, "sha256").hexdigest()
          binary.with_name(binary.name + ".sha256").write_text(
              f"{digest}  {binary.name}\n", encoding="ascii", newline="\n",
          )
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          build_info = [
              f"commit={revision}",
              f"version={version('sanguosha')}",
              f"python={platform.python_version()}",
              f"pyinstaller={version('pyinstaller')}",
              f"architecture={platform.machine()}",
          ]
          binary.with_name(binary.name + ".build.txt").write_text(
              "\n".join(build_info) + "\n", encoding="ascii", newline="\n",
          )
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/${{ steps.package.outputs.artifact }}
            dist/${{ steps.package.outputs.artifact }}.sha256
            dist/${{ steps.package.outputs.artifact }}.build.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find release-assets/ -type f
          echo "===================="

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 三国杀终端版 ${{ github.ref_name }}
          body: |
            ## 三国杀终端版 ${{ github.ref_name }}

            ### 📥 下载
            | 平台 | 文件 |
            |------|------|
            | Windows (x64) | `sanguosha-版本-windows-amd64.exe` |
            | Linux (x64) | `sanguosha-版本-linux-amd64` |
            | macOS (Apple Silicon) | `sanguosha-版本-macos-arm64` |

            ### 🚀 使用方法
            - **Windows**：在 Windows Terminal 的 PowerShell 标签页运行下载的 `.exe`。使用 `Get-FileHash -Algorithm SHA256` 核对同名 `.sha256` 文件。
            - **Linux/macOS**：在终端用 `chmod +x 文件名` 添加执行权限，再执行 `./文件名`。
            - 各平台的 `.build.txt` 记录源码提交、版本和构建环境。

            ### ⚙️ 构建信息
            - Python 3.12 + PyInstaller 6.22.3
            - Textual TUI 跨平台终端界面
          files: |
            release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
