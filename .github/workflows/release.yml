# 多平台构建 + 自动 Release 工作流
# 触发条件: push tag v* (如 v3.4.0)
# 构建: Windows (.exe) + macOS (binary) + Linux (binary)
# 发布: 自动创建 GitHub Release 并上传三平台产物

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            platform: windows-amd64
            extension: .exe
          - name: Linux
            os: ubuntu-latest
            platform: linux-amd64
            extension: ''
          - name: macOS
            os: macos-15
            platform: macos-arm64
            extension: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install '.[build]'

      - name: Build with PyInstaller
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.platform }}
          EXTENSION: ${{ matrix.platform.extension }}
        run: |
          version=$(python -c 'from importlib.metadata import version; print(version("sanguosha"))')
          test "v$version" = "$GITHUB_REF_NAME"
          name="sanguosha-$version-$PLATFORM"
          python -m PyInstaller --version
          python build.py --name "$name"
          echo "artifact=$name$EXTENSION" >> "$GITHUB_OUTPUT"

      - name: Verify runnable artifact outside the repository
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          binary="$GITHUB_WORKSPACE/dist/$ARTIFACT"
          cd "$RUNNER_TEMP"
          "$binary" --help
          if [ "$RUNNER_OS" = macOS ]; then
            python "$GITHUB_WORKSPACE/tools/macos_smoke.py" "$binary"
          fi
          python -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); print(hashlib.sha256(path.read_bytes()).hexdigest(), path.name)' "$binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find release-assets/ -type f
          echo "===================="

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 三国杀终端版 ${{ github.ref_name }}
          body: |
            ## 三国杀终端版 ${{ github.ref_name }}

            ### 📥 下载
            | 平台 | 文件 |
            |------|------|
            | Windows (x64) | `sanguosha-版本-windows-amd64.exe` |
            | Linux (x64) | `sanguosha-版本-linux-amd64` |
            | macOS (Apple Silicon) | `sanguosha-版本-macos-arm64` |

            ### 🚀 使用方法
            - **Windows**: 双击 `.exe` 运行
            - **Linux/macOS**：在终端用 `chmod +x 文件名` 添加执行权限，再执行 `./文件名`。

            ### ⚙️ 构建信息
            - Python 3.12 + PyInstaller 6.22.3
            - Textual TUI 跨平台终端界面
          files: |
            release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
