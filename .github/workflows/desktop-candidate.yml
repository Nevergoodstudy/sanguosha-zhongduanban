name: Desktop practice candidate

on:
  push:
    branches: ['architecture/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop practice (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS arm64
            runner: macos-15
            triple: aarch64-apple-darwin
            extension: ''
            bundle: app
            path: desktop/src-tauri/target/release/bundle/macos/*.zip
          - name: Windows x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            extension: .exe
            bundle: nsis
            path: desktop/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build packaged Python sidecar
        shell: bash
        env:
          TRIPLE: ${{ matrix.platform.triple }}
        run: |
          python -m pip install '.[build]'
          python build.py --name "practice-engine-$TRIPLE" --output-dir desktop/src-tauri/binaries
      - name: Exercise the frozen sidecar
        shell: bash
        timeout-minutes: 3
        env:
          TRIPLE: ${{ matrix.platform.triple }}
          EXTENSION: ${{ matrix.platform.extension }}
        run: python tools/desktop_smoke.py "desktop/src-tauri/binaries/practice-engine-$TRIPLE$EXTENSION"
      - name: Build desktop bundle
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.platform.bundle }}
      - name: Archive the macOS bundle
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent 'Sanguosha Practice.app' sanguosha-practice-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-practice-${{ matrix.platform.triple }}
          path: ${{ matrix.platform.path }}
          if-no-files-found: error
